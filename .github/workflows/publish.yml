# Draft only. Place at .github/workflows/publish.yml in the approved new repository.
name: Publish approved baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cmathew654-dot/agenthon-track4-baseline:dev-smoke-20261013
      DOCKER_CONFIG: ${{ runner.temp }}/agenthon-docker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build approved public source
        run: >-
          docker build --platform linux/amd64
          --label org.opencontainers.image.source=https://github.com/cmathew654-dot/agenthon-track4-baseline
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label 'org.opencontainers.image.description=Model-free Track 4 packaging baseline with manifest-bound entity citations'
          --tag "$IMAGE" .
      - name: Publish through temporary workflow authorization
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username cmathew654-dot --password-stdin
          docker push "$IMAGE"
      - name: Clear runner-local registry login
        if: always()
        run: docker logout ghcr.io
